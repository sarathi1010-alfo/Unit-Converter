name: SEO Pipeline Quality Gate

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build_and_validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

      - name: Build Project
        run: npm run build

      - name: Run SEO Quality Gate Validation
        run: npm run validate:seo

      - name: Start Production Server
        run: |
          npm install -g serve
          npx serve@latest out -l 3000 > serve.log 2>&1 &
          sleep 5

      - name: Run Headless Browser Verification
        run: npx ts-node --compiler-options '{"module":"commonjs"}' scripts/verify-urls.ts
